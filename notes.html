<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e4e9df">
  <title>全文 / 教父</title>
  <link rel="stylesheet" href="assets/css/image-viewer.css">
  <style>
    :root {
      --paper: #1d3029;
      --paper-muted: #65736b;
      --ink: #e4e9df;
      --panel: #f3efe5;
      --panel-light: #fbf8f0;
      --line: rgba(29, 48, 41, .16);
      --line-strong: rgba(29, 48, 41, .3);
      --accent: #a35e3d;
      --accent-bright: #bd764d;
      --olive: #38584b;
      --serif: Georgia, 'Noto Serif SC', 'Songti SC', serif;
      --sans: Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    * { box-sizing: border-box; }
    html { background: var(--ink); scroll-behavior: auto; }
    body { min-width: 320px; margin: 0; overflow-x: hidden; color: var(--paper); background: linear-gradient(135deg, #e4e9df 0%, #eeeae0 48%, #dce5dc 100%); font-family: var(--sans); }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .grain { position: fixed; z-index: 10; inset: 0; pointer-events: none; opacity: .04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E"); mix-blend-mode: multiply; }
    .notes-header { position: sticky; z-index: 5; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 1.4rem; min-height: 4.8rem; padding: .8rem clamp(1rem, 5vw, 4.5rem); border-bottom: 1px solid var(--line); background: rgba(228, 233, 223, .86); backdrop-filter: blur(18px); }
    .brand { display: inline-flex; align-items: center; gap: .65rem; min-width: max-content; }
    .brand-mark { display: grid; place-items: center; width: 2rem; height: 2rem; border: 1px solid var(--olive); border-radius: 50%; color: var(--olive); }
    .brand-mark svg { width: 1rem; height: 1rem; }
    .brand-copy { display: grid; gap: .18rem; }
    .brand-copy strong { color: var(--paper); font-size: .78rem; font-weight: 700; letter-spacing: .08em; }
    .brand-copy span { color: var(--paper-muted); font-size: .48rem; letter-spacing: .18em; text-transform: uppercase; }
    .notes-nav { display: flex; align-items: center; gap: clamp(.9rem, 2.2vw, 2rem); color: var(--paper-muted); font-size: .68rem; }
    .notes-nav a { position: relative; padding: .8rem 0; transition: color .3s ease; }
    .notes-nav a::after { position: absolute; right: 0; bottom: .35rem; left: 0; height: 1px; background: var(--accent); content: ''; transform: scaleX(0); transform-origin: right; transition: transform .4s var(--ease); }
    .notes-nav a:hover, .notes-nav a.is-active { color: var(--paper); }
    .notes-nav a:hover::after, .notes-nav a.is-active::after { transform: scaleX(1); transform-origin: left; }
    .notes-return { display: inline-flex; align-items: center; gap: .45rem; padding: .62rem .9rem; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--paper); font-size: .62rem; transition: background .3s ease, transform .35s var(--ease); }
    .notes-return svg { width: .85rem; height: .85rem; color: var(--accent); }
    .notes-return:hover { background: rgba(56, 88, 75, .08); transform: translateY(-2px); }
    .notes-main { width: min(100% - 2rem, 88rem); margin: 0 auto; }
    .notes-hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(15rem, .85fr); gap: clamp(2rem, 8vw, 8rem); align-items: end; min-height: 27rem; padding: clamp(4rem, 11vw, 9rem) 0 clamp(3rem, 7vw, 6rem); border-bottom: 1px solid var(--line); }
    .notes-kicker { display: inline-flex; align-items: center; gap: .7rem; color: var(--accent); font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; }
    .notes-kicker::before { width: 2.3rem; height: 1px; background: currentColor; content: ''; }
    .notes-hero h1 { max-width: none; margin: 1.3rem 0 0; color: var(--paper); font-family: var(--serif); font-size: clamp(3.4rem, 9vw, 8.7rem); font-weight: 400; letter-spacing: -.08em; line-height: .86; }
    .notes-hero p { max-width: 25rem; margin: 0 0 .4rem; color: var(--paper-muted); font-family: var(--serif); font-size: clamp(1rem, 1.7vw, 1.35rem); line-height: 1.7; }
    .notes-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 1.7rem; background: var(--line); }
    .notes-stats span { display: grid; gap: .25rem; padding: .85rem .7rem; background: rgba(243, 239, 229, .65); color: var(--paper-muted); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; }
    .notes-stats strong { color: var(--paper); font-family: var(--serif); font-size: 1.45rem; font-weight: 400; letter-spacing: 0; }
    .note-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--line); }
    .note-toolbar-meta { display: flex; flex-wrap: wrap; gap: 1rem; color: var(--paper-muted); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; }
    .note-toolbar-meta strong { color: var(--accent); font-weight: 600; }
    .note-toolbar a { display: inline-flex; align-items: center; gap: .45rem; color: var(--paper); font-size: .68rem; }
    .note-toolbar a svg { width: .9rem; height: .9rem; color: var(--accent); }
    .note-layout { display: grid; grid-template-columns: minmax(12rem, .25fr) minmax(0, .75fr); gap: clamp(2rem, 7vw, 7rem); align-items: start; padding: 2rem 0 8rem; }
    .note-sidebar { position: sticky; top: 6.2rem; min-width: 0; }
    .note-toc-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: .8rem; border-bottom: 1px solid var(--line); color: var(--accent); font-size: .58rem; letter-spacing: .18em; text-transform: uppercase; }
    .note-toc-head svg { width: .95rem; height: .95rem; }
    .note-toc { display: grid; gap: .12rem; max-height: calc(100vh - 8rem); overflow: auto; padding: .8rem 0; scrollbar-color: var(--accent) transparent; scrollbar-width: thin; }
    .note-toc a { display: block; padding: .38rem .6rem; border-left: 1px solid transparent; color: var(--paper-muted); font-size: .67rem; line-height: 1.45; transition: color .3s ease, border-color .3s ease, transform .35s var(--ease), background .3s ease; }
    .note-toc a[data-depth="3"] { padding-left: 1.2rem; font-size: .61rem; }
    .note-toc a:hover, .note-toc a.is-active { border-left-color: var(--accent); color: var(--paper); background: rgba(56, 88, 75, .08); transform: translateX(.2rem); }
    .note-content { min-width: 0; max-width: 59rem; color: rgba(29, 48, 41, .84); font-family: var(--serif); font-size: 1rem; line-height: 2.02; }
    .note-chapter { padding: 1rem 0 4rem; border-bottom: 1px solid var(--line); scroll-margin-top: 6.2rem; }
    .note-chapter + .note-chapter { padding-top: 3.5rem; }
    .note-content h1 { margin: 0 0 1.5rem; color: var(--paper); font-size: clamp(2rem, 4vw, 4rem); font-weight: 400; letter-spacing: -.06em; line-height: 1; }
    .note-content h2 { margin: 0 0 1.7rem; padding-top: .6rem; color: var(--paper); font-size: clamp(2.2rem, 4.6vw, 4.8rem); font-weight: 400; letter-spacing: -.07em; line-height: .98; scroll-margin-top: 6.2rem; }
    .note-content h3 { margin: 3rem 0 .8rem; color: var(--accent); font-size: clamp(1.45rem, 2.4vw, 2.35rem); font-weight: 400; letter-spacing: -.045em; line-height: 1.08; scroll-margin-top: 6.2rem; }
    .note-content h4 { margin: 2.2rem 0 .7rem; padding-top: .8rem; border-top: 1px solid var(--line); color: var(--paper); font-family: var(--sans); font-size: 1.15rem; font-weight: 700; line-height: 1.35; scroll-margin-top: 6.2rem; }
    .note-content p { margin: 0 0 1.1rem; }
    .note-content [data-note-block] { scroll-margin-top: 6.2rem; }
    .note-content strong { color: var(--paper); }
    .note-content em { color: var(--accent); }
    .note-content a { color: var(--olive); text-decoration: underline; text-decoration-color: rgba(56, 88, 75, .35); text-underline-offset: .15em; }
    .note-content blockquote { margin: 1.8rem 0; padding: 1.2rem 1.4rem; border-left: 2px solid var(--accent); color: var(--paper); background: rgba(163, 94, 61, .08); }
    .note-content ul, .note-content ol { margin: 0 0 1.2rem; padding-left: 1.5rem; }
    .note-content li { margin: .55rem 0; }
    .note-content img { display: block; width: 100%; height: clamp(11rem, 34vw, 32rem); margin: 2rem 0; object-fit: contain; background: #d4ddd5; filter: sepia(.08) saturate(.86); }
    .note-content img[src*="assets/posters/"] { width: min(100%, 28rem); height: auto; max-height: 46rem; margin: 2.4rem auto; background: #0a0907; filter: sepia(.04) saturate(.95); box-shadow: 0 1.5rem 3.5rem rgba(29, 48, 41, .18); }
.note-content img[src*="godfather1.jpg"] { aspect-ratio: 800 / 1136; }
.note-content img[src*="godfather2.jpg"] { aspect-ratio: 800 / 1140; }
.note-content img[src*="godfather3.jpg"] { aspect-ratio: 800 / 1199; }
    .note-content table { display: block; width: 100%; margin: 1.8rem 0; overflow-x: auto; border-collapse: collapse; font-family: var(--sans); font-size: .7rem; line-height: 1.65; scrollbar-color: var(--accent) transparent; scrollbar-width: thin; }
    .note-content th, .note-content td { min-width: 8rem; padding: .7rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
    .note-content th { color: var(--accent); background: rgba(56, 88, 75, .08); font-weight: 700; }
    .note-content code { padding: .1em .3em; color: var(--paper); background: rgba(56, 88, 75, .08); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .8em; }
    .note-content .person-mention { display: inline; margin: 0; padding: 0 .08em .04em; border: 0; border-bottom: 1px solid rgba(56, 88, 75, .42); border-radius: .12em; color: var(--olive); background: rgba(56, 88, 75, .035); cursor: pointer; text-align: inherit; text-decoration: none; transition: color .25s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease; }
    .note-content .person-mention:hover { border-bottom-color: var(--accent); color: var(--accent); background: rgba(163, 94, 61, .08); }
    .note-content .person-mention:active { background: rgba(163, 94, 61, .16); }
    .note-content .person-mention:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; box-shadow: 0 0 0 4px rgba(163, 94, 61, .12); }
    .person-confirm[hidden] { display: none; }
    .person-confirm { position: fixed; z-index: 230; inset: 0; display: grid; place-items: center; padding: 1.25rem; visibility: hidden; opacity: 0; pointer-events: none; transition: opacity .3s ease, visibility 0s linear .3s; }
    .person-confirm.is-open { visibility: visible; opacity: 1; pointer-events: auto; transition-delay: 0s; }
    .person-confirm.is-closing { visibility: visible; opacity: 0; pointer-events: none; }
    .person-confirm-backdrop { position: absolute; inset: 0; background: rgba(29, 48, 41, .52); backdrop-filter: blur(14px) saturate(82%); }
    .person-confirm-panel { position: relative; width: min(100%, 34rem); max-height: min(90vh, 42rem); overflow: auto; padding: clamp(1.5rem, 4vw, 2.8rem); border: 1px solid var(--line-strong); color: var(--paper); background: var(--panel-light); box-shadow: 0 2rem 5rem rgba(29, 48, 41, .26); transform: translateY(1rem) scale(.98); transition: transform .42s var(--ease), opacity .3s ease; }
    .person-confirm.is-open .person-confirm-panel { transform: none; }
    .person-confirm.is-closing .person-confirm-panel { transform: translateY(.65rem) scale(.985); }
    .person-confirm-close { position: absolute; top: .8rem; right: .8rem; display: grid; place-items: center; width: 2.35rem; height: 2.35rem; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--paper); background: transparent; cursor: pointer; transition: transform .3s var(--ease), background .25s ease, border-color .25s ease; }
    .person-confirm-close:hover { border-color: var(--accent); background: rgba(163, 94, 61, .09); transform: rotate(8deg); }
    .person-confirm-close:focus-visible, .person-confirm-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .person-confirm-close svg { width: 1rem; height: 1rem; }
    .person-confirm-kicker { display: block; margin-bottom: .8rem; color: var(--accent); font-size: .65rem; letter-spacing: .18em; text-transform: uppercase; }
    .person-confirm-panel h2 { max-width: 90%; margin: 0; color: var(--paper); font-family: var(--serif); font-size: clamp(1.6rem, 4vw, 2.5rem); font-weight: 400; line-height: 1.12; }
    .person-confirm-panel p { margin: 1rem 0 0; color: var(--paper-muted); font-size: .95rem; line-height: 1.75; }
    .person-confirm-name { color: var(--accent); font-weight: 700; }
    .person-confirm-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .65rem; margin-top: 1.6rem; }
    .person-confirm-action { min-height: 2.7rem; padding: .7rem 1rem; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--paper); background: transparent; cursor: pointer; font-size: .82rem; transition: transform .3s var(--ease), background .25s ease, border-color .25s ease; }
    .person-confirm-action:hover { border-color: var(--accent); background: rgba(163, 94, 61, .1); transform: translateY(-2px); }
    .person-confirm-action--primary { border-color: var(--accent); color: var(--panel-light); background: var(--accent); }
    .person-confirm-action--primary:hover { color: var(--panel-light); background: var(--accent-bright); }
    .note-reveal { opacity: 0; transform: translateY(1.2rem); transition: opacity .8s var(--ease), transform .8s var(--ease); }
    .note-reveal.is-visible { opacity: 1; transform: none; }
    .search-hit { animation: noteHit 1.7s var(--ease) both; }
    @keyframes noteHit { 0%, 100% { background: transparent; } 22% { background: rgba(163, 94, 61, .2); } }
    .note-content img.note-reveal { transform: translateY(1.2rem) scale(.985); }
    .note-content img.note-reveal.is-visible { transform: none; }
    .back-top { position: fixed; right: 1.4rem; bottom: 1.4rem; z-index: 4; display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--paper); background: rgba(243, 239, 229, .84); cursor: pointer; backdrop-filter: blur(12px); transition: transform .35s var(--ease), background .3s ease; }
    .back-top svg { width: .95rem; height: .95rem; }
    .back-top:hover { background: var(--panel-light); transform: translateY(-3px); }
    @media (max-width: 900px) {
      .notes-header { flex-wrap: wrap; }
      .notes-nav { order: 3; width: 100%; justify-content: space-between; border-top: 1px solid var(--line); }
      .notes-hero { grid-template-columns: 1fr; min-height: auto; }
      .note-layout { grid-template-columns: 1fr; }
      .note-sidebar { position: relative; top: auto; }
      .note-toc { display: flex; max-height: none; overflow-x: auto; padding: .8rem 0; }
      .note-toc a { min-width: max-content; border-bottom: 1px solid transparent; border-left: 0; }
      .note-toc a[data-depth="3"] { padding-left: .6rem; }
      .note-toc a:hover, .note-toc a.is-active { border-bottom-color: var(--accent); border-left: 0; transform: none; }
    }
    @media (max-width: 620px) {
      .notes-main { width: min(100% - 1.25rem, 88rem); }
      .notes-header { padding-inline: .7rem; }
      .brand-copy span, .notes-return span { display: none; }
      .notes-nav { gap: .45rem; font-size: .62rem; }
      .notes-hero { padding-top: 3.8rem; }
      .notes-stats span { padding-inline: .45rem; }
      .note-toolbar { align-items: flex-start; flex-direction: column; }
      .note-content { font-size: .94rem; }
      .note-content img { height: 11rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .001ms !important; animation-duration: .001ms !important; }
      .note-reveal { opacity: 1; transform: none; }
      .person-confirm-panel { transform: none; }
    }
    /* systematic typography */
    :root {
      --archive-hero-size: clamp(4rem, 7.2vw, 8.4rem);
      --archive-hero-leading: .92;
      --archive-hero-tracking: -.06em;
      --archive-body-measure: 30rem;
      --archive-chapter-size: clamp(3rem, 5.8vw, 4.8rem);
    }
    .title-line { display: block; white-space: normal; }
    .note-content h1, .note-content h2, .note-content h3 { text-wrap: balance; }
    .note-content h1 .title-group, .note-content h2 .title-group, .note-content h3 .title-group { display: inline; }
    @media (min-width: 901px) {
      :root {
        --archive-ui-nav-size: clamp(.88rem, .82rem + .16vw, 1rem);
        --archive-ui-toc-size: clamp(.9rem, .84rem + .14vw, 1rem);
        --archive-ui-toc-sub-size: clamp(.82rem, .78rem + .12vw, .92rem);
        --archive-ui-action-size: clamp(.82rem, .78rem + .12vw, .9rem);
        --archive-ui-meta-size: clamp(.76rem, .72rem + .12vw, .86rem);
        --archive-ui-micro-size: clamp(.7rem, .66rem + .08vw, .78rem);
      }
      .notes-header { min-height: 5.2rem; padding-block: .95rem; }
      .brand-copy strong { font-size: .9rem; }
      .brand-copy span { font-size: var(--archive-ui-micro-size); }
      .notes-nav { font-size: var(--archive-ui-nav-size); }
      .notes-nav a { padding-block: .9rem; }
      .notes-return { padding: .72rem 1rem; font-size: var(--archive-ui-action-size); }
      .notes-kicker,
      .note-toc-head { font-size: var(--archive-ui-micro-size); }
      .notes-stats span,
      .note-toolbar-meta { font-size: var(--archive-ui-meta-size); }
      .note-toolbar a { font-size: var(--archive-ui-action-size); }
      .note-toc a { padding-block: .45rem; font-size: var(--archive-ui-toc-size); line-height: 1.55; }
      .note-toc a[data-depth="3"] { font-size: var(--archive-ui-toc-sub-size); }
      .note-toc a:hover, .note-toc a.is-active { transform: translateY(-1px); }
      .note-sidebar { top: 6.8rem; }
      .title-line { white-space: nowrap; }
      .notes-hero { grid-template-columns: minmax(0, 1.25fr) minmax(19rem, .75fr); gap: clamp(2rem, 7vw, 7rem); }
      .notes-hero > div { min-width: 0; }
      .notes-hero h1 { max-width: none; font-size: var(--archive-hero-size); line-height: var(--archive-hero-leading); letter-spacing: var(--archive-hero-tracking); }
      .notes-hero p { max-width: var(--archive-body-measure); line-height: 1.65; }
      .note-content h1 .title-group, .note-content h1 .title-group--parenthetical, .note-content h2 .title-group--parenthetical, .note-content h3 .title-group--parenthetical { white-space: nowrap; }
    }
    @media (min-width: 901px) and (max-width: 1100px) {
      .notes-hero { grid-template-columns: minmax(0, 1fr) minmax(18rem, .72fr); gap: 2rem; }
      .notes-hero h1 { font-size: clamp(4rem, 7.5vw, 6.8rem); }
      .note-content h1 { font-size: var(--archive-chapter-size); }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="notes-header">
    <a class="brand" href="index.html" aria-label="回到教父首页">
      <span class="brand-mark"><i data-lucide="crown"></i></span>
      <span class="brand-copy"><strong>教父</strong><span>the godfather</span></span>
    </a>
    <nav class="notes-nav" aria-label="主导航">
      <a href="index.html#rules">法则</a>
      <a class="is-active" href="#noteContent">全文</a>
      <a href="index.html#timeline">编年</a>
      <a href="index.html#characters">人物</a>
      <a href="index.html#motifs">符号</a>
    </nav>
    <a class="notes-return" href="index.html"><i data-lucide="arrow-left"></i><span>回到档案地图</span></a>
  </header>
  <main class="notes-main">
    <section class="notes-hero">
      <div>
        <span class="notes-kicker">the complete dossier</span>
        <h1><span class="title-line">把所有沉默</span><span class="title-line">还给正文</span></h1>
      </div>
      <div>
        <p>一份关于庇护如何变成诅咒的完整笔记。这里不删减摘要，只把原文交还给它自己的节奏。</p>
        <div class="notes-stats"><span><strong id="notesChapterCount">10</strong>章节</span><span><strong id="notesPeopleCount">44</strong>人物</span><span><strong id="notesImageCount">80</strong>张影像</span></div>
      </div>
    </section>
    <div class="note-toolbar">
      <div class="note-toolbar-meta"><strong id="noteMeta">10 章 / 44 人物 / 80 张影像</strong><span id="noteProgress">正文 01 / 12</span></div>
      <a href="#noteContent"><i data-lucide="book-open"></i>从当前位置开始</a>
    </div>
    <div class="note-layout">
      <aside class="note-sidebar">
        <div class="note-toc-head"><span>archive index</span><i data-lucide="list-tree"></i></div>
        <nav class="note-toc" id="noteToc" aria-label="全文目录"></nav>
      </aside>
      <article class="note-content" id="noteContent" aria-live="polite"><p>正在展开完整档案</p></article>
    </div>
  </main>
  <button class="back-top" type="button" aria-label="回到顶部" title="回到顶部"><i data-lucide="arrow-up"></i></button>
  <div class="person-confirm" id="personConfirm" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="personConfirmTitle" aria-describedby="personConfirmDescription" hidden>
    <div class="person-confirm-backdrop" data-close-person-confirm></div>
    <div class="person-confirm-panel" role="document">
      <button class="person-confirm-close" type="button" data-close-person-confirm aria-label="关闭人物跳转确认"><i data-lucide="x"></i></button>
      <span class="person-confirm-kicker">character archive</span>
      <h2 id="personConfirmTitle">查看人物档案</h2>
      <p id="personConfirmDescription">你即将查看 <span class="person-confirm-name" id="personConfirmName"></span> 的人物介绍，是否前往首页人物卡片？</p>
      <div class="person-confirm-actions">
        <button class="person-confirm-action" id="personConfirmCancel" type="button">继续阅读</button>
        <button class="person-confirm-action person-confirm-action--primary" id="personConfirmGo" type="button">查看人物介绍</button>
      </div>
    </div>
  </div>
  <script src="assets/vendor/lucide.min.js"></script>
  <script src="assets/data/archive.js"></script>
  <script src="assets/js/image-viewer.js"></script>
  <script>
    (() => {
      const archive = window.CORLEONE_ARCHIVE;
      const noteContent = document.getElementById('noteContent');
      const noteToc = document.getElementById('noteToc');
      const noteProgress = document.getElementById('noteProgress');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const hydrateIcons = () => window.lucide?.createIcons({ attrs: { 'aria-hidden': 'true' } });
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
      const personConfirm = document.getElementById('personConfirm');
      const personConfirmName = document.getElementById('personConfirmName');
      const personConfirmCancel = document.getElementById('personConfirmCancel');
      const personConfirmGo = document.getElementById('personConfirmGo');
      const notesBackground = [document.querySelector('.notes-header'), document.querySelector('.notes-main'), document.querySelector('.back-top')].filter(Boolean);
      let personConfirmTrigger = null;
      let personConfirmTarget = null;
      let personConfirmCloseTimer;
      let personConfirmOpenFrame;
      let personConfirmPreviousOverflow = '';
      let personConfirmPreviousScrollY = 0;
      let personConfirmState = 'closed';
      let noteHashJumpTimer;
      let noteReturnRestoreFrame;
      let noteReturnRestoreToken = 0;
      let noteReturnRestoreDeadline = 0;

      function setNotesBackgroundInert(isInert) {
        notesBackground.forEach((element) => { element.inert = isInert; });
      }

      function personMentionSpecs() {
        return archive.people.flatMap((person) => (person.mentions || []).map((name) => ({ name, person })));
      }

      function isAsciiWordCharacter(character) {
        return Boolean(character) && /[A-Za-z0-9_]/.test(character);
      }

      function hasEnglishWordBoundary(text, start, end, name) {
        if (!/[A-Za-z0-9]/.test(name)) return true;
        return !isAsciiWordCharacter(text[start - 1]) && !isAsciiWordCharacter(text[end]);
      }

      function mentionExcluded(spec, blockId) {
        return (spec.person.mentionExclusions || []).some((exclusion) => exclusion.blockId === blockId && exclusion.text === spec.name);
      }

      function findMentionMatches(text, specs, blockId) {
        const matches = [];
        let cursor = 0;
        while (cursor < text.length) {
          const candidate = specs.find((spec) => text.startsWith(spec.name, cursor) && hasEnglishWordBoundary(text, cursor, cursor + spec.name.length, spec.name) && !mentionExcluded(spec, blockId));
          if (!candidate) {
            cursor += 1;
            continue;
          }
          matches.push({ start: cursor, end: cursor + candidate.name.length, spec: candidate });
          cursor += candidate.name.length;
        }
        return matches;
      }

      function annotatePersonMentions() {
        if (noteContent.dataset.personMentionsReady === 'true') return;
        const specs = personMentionSpecs().sort((a, b) => b.name.length - a.name.length || a.person.id.localeCompare(b.person.id) || a.name.localeCompare(b.name));
        const walker = document.createTreeWalker(noteContent, NodeFilter.SHOW_TEXT);
        const textNodes = [];
        let node;
        while ((node = walker.nextNode())) textNodes.push(node);
        textNodes.forEach((textNode, nodeIndex) => {
          const parent = textNode.parentElement;
          const container = parent?.closest('p, li, blockquote, th, td, h4');
          if (!container || parent.closest('a, button, code, pre, script, style, textarea, select')) return;
          const blockElement = parent.closest('[data-note-block]');
          const blockId = blockElement?.id || blockElement?.dataset.noteBlock || '';
          const matches = findMentionMatches(textNode.data, specs, blockId);
          if (!matches.length || !textNode.parentNode) return;
          const anchor = blockElement?.id || parent.closest('[id]')?.id || 'note-content';
          const fragment = document.createDocumentFragment();
          let last = 0;
          matches.forEach(({ start, end, spec }, matchIndex) => {
            if (start > last) fragment.append(document.createTextNode(textNode.data.slice(last, start)));
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'person-mention';
            button.dataset.person = spec.person.id;
            button.dataset.mention = `${spec.person.id}:${anchor}:${nodeIndex}:${matchIndex}:${start}`;
            button.setAttribute('aria-label', `查看${spec.name}的人物介绍`);
            button.textContent = spec.name;
            fragment.append(button);
            last = end;
          });
          if (last < textNode.data.length) fragment.append(document.createTextNode(textNode.data.slice(last)));
          textNode.parentNode.replaceChild(fragment, textNode);
        });
        noteContent.dataset.personMentionsReady = 'true';
      }

      function focusableInPersonConfirm() {
        return [...personConfirm.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
          .filter((element) => !element.disabled && !element.hidden && element.getClientRects().length);
      }

      function finishPersonConfirm(restoreFocus = true) {
        cancelAnimationFrame(personConfirmOpenFrame);
        personConfirmOpenFrame = undefined;
        personConfirm.hidden = true;
        personConfirm.classList.remove('is-open', 'is-closing');
        personConfirm.setAttribute('aria-hidden', 'true');
        personConfirmGo.disabled = false;
        personConfirmState = 'closed';
        setNotesBackgroundInert(false);
        document.body.style.overflow = personConfirmPreviousOverflow;
        window.scrollTo({ top: personConfirmPreviousScrollY, left: 0, behavior: 'auto' });
        const trigger = personConfirmTrigger;
        personConfirmTrigger = null;
        personConfirmTarget = null;
        if (restoreFocus && trigger?.isConnected) trigger.focus({ preventScroll: true });
      }

      function getSavedNoteReturnPosition() {
        const saved = window.history.state?.noteCharacterReturn;
        return saved && Number.isFinite(saved.scrollY) && typeof saved.hash === 'string' ? saved : null;
      }

      function clearSavedNoteReturnPosition() {
        const currentState = window.history.state;
        if (!currentState || typeof currentState !== 'object' || !('noteCharacterReturn' in currentState)) return;
        const nextState = { ...currentState };
        delete nextState.noteCharacterReturn;
        window.history.replaceState(Object.keys(nextState).length ? nextState : null, '', window.location.href);
      }

      function cancelNoteReturnRestore({ clearState = false } = {}) {
        noteReturnRestoreToken += 1;
        cancelAnimationFrame(noteReturnRestoreFrame);
        noteReturnRestoreFrame = undefined;
        noteReturnRestoreDeadline = 0;
        if (clearState) clearSavedNoteReturnPosition();
      }

      function cancelPendingNoteNavigation({ clearState = false } = {}) {
        clearTimeout(noteHashJumpTimer);
        noteHashJumpTimer = undefined;
        cancelNoteReturnRestore({ clearState });
      }

      function restoreSavedNoteReturnPosition() {
        cancelNoteReturnRestore();
        const saved = getSavedNoteReturnPosition();
        if (!saved || saved.hash !== window.location.hash) return false;
        clearTimeout(noteHashJumpTimer);
        noteHashJumpTimer = undefined;
        const token = ++noteReturnRestoreToken;
        noteReturnRestoreDeadline = performance.now() + 4000;
        let previous = null;
        let stableSamples = 0;
        const anchor = saved.anchorId ? document.getElementById(saved.anchorId) : null;
        const imagesBeforeAnchor = anchor ? [...noteContent.querySelectorAll('img')].filter((image) => image.compareDocumentPosition(anchor) & Node.DOCUMENT_POSITION_FOLLOWING) : [];
        const layoutSensitiveImages = imagesBeforeAnchor.filter((image) => {
          const rect = image.getBoundingClientRect();
          return rect.height === 0 && (!image.complete || image.naturalWidth <= 0);
        });
        const sample = () => {
          const currentSaved = getSavedNoteReturnPosition();
          if (token !== noteReturnRestoreToken || window.location.hash !== saved.hash || !currentSaved || currentSaved.hash !== saved.hash || currentSaved.scrollY !== saved.scrollY) return;
          const rect = anchor?.getBoundingClientRect();
          const computed = anchor ? getComputedStyle(anchor) : null;
          const imagesReady = layoutSensitiveImages.every((image) => image.complete && image.naturalWidth > 0);
          const revealReady = !anchor || (computed?.opacity === '1' && computed?.transform === 'none');
          if (anchor && Number.isFinite(saved.anchorViewportTop) && rect) {
            const correctedScrollY = Math.max(0, window.scrollY + rect.top - saved.anchorViewportTop);
            if (Math.abs(correctedScrollY - window.scrollY) > 0.5) window.scrollTo({ top: correctedScrollY, left: 0, behavior: 'auto' });
          } else if (!anchor) {
            window.scrollTo({ top: saved.scrollY, left: 0, behavior: 'auto' });
          }
          const current = Math.round(window.scrollY);
          const signature = [current, rect?.top, rect?.left, rect?.width, rect?.height, computed?.opacity, computed?.transform].map((value) => typeof value === 'number' ? value.toFixed(2) : value).join('|');
          stableSamples = revealReady && signature === previous ? stableSamples + 1 : 0;
          previous = signature;
          const stable = stableSamples >= 3 && document.fonts.status === 'loaded' && imagesReady && revealReady;
          const expired = performance.now() >= noteReturnRestoreDeadline;
          if (stable) {
            if (!anchor) window.scrollTo({ top: saved.scrollY, left: 0, behavior: 'auto' });
            noteReturnRestoreFrame = window.requestAnimationFrame(() => {
              if (token === noteReturnRestoreToken && window.location.hash === saved.hash) {
                const finalState = getSavedNoteReturnPosition();
                if (finalState?.hash === saved.hash && finalState.scrollY === saved.scrollY) clearSavedNoteReturnPosition();
              }
              if (token === noteReturnRestoreToken) {
                noteReturnRestoreFrame = undefined;
                noteReturnRestoreDeadline = 0;
              }
            });
            return;
          }
          if (expired) {
            if (token === noteReturnRestoreToken && window.location.hash === saved.hash) clearSavedNoteReturnPosition();
            noteReturnRestoreFrame = undefined;
            noteReturnRestoreDeadline = 0;
            return;
          }
          noteReturnRestoreFrame = window.requestAnimationFrame(sample);
        };
        noteReturnRestoreFrame = window.requestAnimationFrame(sample);
        return true;
      }

      function closePersonConfirm({ restoreFocus = true } = {}) {
        if (personConfirmState === 'closed' || personConfirmState === 'navigating') return;
        cancelAnimationFrame(personConfirmOpenFrame);
        personConfirmOpenFrame = undefined;
        clearTimeout(personConfirmCloseTimer);
        personConfirmState = 'closing';
        personConfirm.classList.remove('is-open');
        personConfirm.classList.add('is-closing');
        personConfirmCloseTimer = window.setTimeout(() => finishPersonConfirm(restoreFocus), reduceMotion ? 0 : 320);
      }

      function openPersonConfirm(trigger) {
        const person = archive.people.find((item) => item.id === trigger.dataset.person);
        if (!person || personConfirmState === 'navigating') return;
        cancelAnimationFrame(personConfirmOpenFrame);
        clearTimeout(personConfirmCloseTimer);
        if (personConfirmState === 'closed') {
          personConfirmPreviousOverflow = document.body.style.overflow;
          personConfirmPreviousScrollY = window.scrollY;
          document.body.style.overflow = 'hidden';
        }
        personConfirmState = 'opening';
        personConfirmTrigger = trigger;
        personConfirmTarget = person;
        personConfirmName.textContent = trigger.textContent.trim();
        personConfirmGo.disabled = false;
        personConfirm.hidden = false;
        personConfirm.classList.remove('is-closing');
        personConfirm.setAttribute('aria-hidden', 'false');
        setNotesBackgroundInert(true);
        personConfirmOpenFrame = window.requestAnimationFrame(() => {
          if (personConfirmState !== 'opening') return;
          personConfirmState = 'open';
          personConfirm.classList.add('is-open');
          personConfirmCancel.focus({ preventScroll: true });
          window.scrollTo({ top: personConfirmPreviousScrollY, left: 0, behavior: 'auto' });
        });
      }

      noteContent.addEventListener('click', (event) => {
        const trigger = event.target.closest('.person-mention');
        if (trigger) openPersonConfirm(trigger);
      });
      personConfirm.querySelectorAll('[data-close-person-confirm]').forEach((element) => element.addEventListener('click', () => closePersonConfirm()));
      personConfirmCancel.addEventListener('click', () => closePersonConfirm());
      personConfirmGo.addEventListener('click', () => {
        if (personConfirmState !== 'open' || !personConfirmTarget || !archive.people.some((person) => person.id === personConfirmTarget.id)) return;
        personConfirmState = 'navigating';
        personConfirmGo.disabled = true;
        const currentState = window.history.state && typeof window.history.state === 'object' ? window.history.state : {};
        const anchor = personConfirmTrigger?.closest('[id]');
        const anchorRect = anchor?.getBoundingClientRect();
        window.history.replaceState({ ...currentState, noteCharacterReturn: {
          hash: window.location.hash,
          scrollY: personConfirmPreviousScrollY,
          anchorId: anchor?.id || '',
          anchorViewportTop: anchorRect?.top
        } }, '', window.location.href);
        window.location.href = `index.html?person=${encodeURIComponent(personConfirmTarget.id)}#characters`;
      });
      document.addEventListener('keydown', (event) => {
        if (personConfirmState === 'closed' || personConfirmState === 'navigating') return;
        if (event.key === 'Escape') {
          event.preventDefault();
          event.stopPropagation();
          closePersonConfirm();
          return;
        }
        if (event.key !== 'Tab') return;
        const focusable = focusableInPersonConfirm();
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }, true);
      window.addEventListener('pageshow', () => {
        clearTimeout(personConfirmCloseTimer);
        window.requestAnimationFrame(() => window.requestAnimationFrame(() => {
          if (personConfirmState !== 'closed' || !personConfirm.hidden) finishPersonConfirm(false);
          restoreSavedNoteReturnPosition();
        }));
      });
      window.addEventListener('pagehide', () => cancelPendingNoteNavigation());
      ['pointerdown', 'wheel', 'touchstart', 'keydown'].forEach((eventName) => {
        window.addEventListener(eventName, () => cancelPendingNoteNavigation({ clearState: true }), { capture: true, passive: eventName !== 'keydown' });
      });

      document.getElementById('notesChapterCount').textContent = archive.meta.chapterCount;
      document.getElementById('notesPeopleCount').textContent = archive.meta.peopleCount;
      document.getElementById('notesImageCount').textContent = archive.meta.imageCount;
      document.getElementById('noteMeta').textContent = `${archive.meta.chapterCount} 章 / ${archive.meta.peopleCount} 人物 / ${archive.meta.imageCount} 张影像`;
      noteContent.innerHTML = archive.sections.map((section) => `<section class="note-chapter" id="${escapeHtml(section.id)}">${section.html}</section>`).join('');
      function groupNoteHeadingParentheticals() {
        noteContent.querySelectorAll('h1, h2[id^="chapter-"], h3').forEach((heading) => {
          const fragments = heading.textContent.split(/(（[^）]*）)/g).filter(Boolean);
          if (fragments.length === 1) return;
          heading.replaceChildren(...fragments.map((fragment) => {
            const span = document.createElement('span');
            span.className = fragment.startsWith('（') ? 'title-group title-group--parenthetical' : 'title-group';
            span.textContent = fragment;
            return span;
          }));
        });
      }
      groupNoteHeadingParentheticals();
      annotatePersonMentions();
      hydrateIcons();

      const headings = [...noteContent.querySelectorAll('h2, h3')];
      noteToc.innerHTML = headings.map((heading) => `<a href="#${escapeHtml(heading.id)}" data-depth="${heading.tagName.slice(1)}">${escapeHtml(heading.textContent.trim())}</a>`).join('');
      const tocLinks = [...noteToc.querySelectorAll('a')];
      const noteChapterList = [...noteContent.querySelectorAll('.note-chapter')];

      function updateTocFromGeometry() {
        if (!headings.length) return;
        const marker = window.innerHeight * .34;
        let current = headings[0];
        headings.forEach((heading) => {
          if (heading.getBoundingClientRect().top <= marker) current = heading;
        });
        tocLinks.forEach((link) => link.classList.toggle('is-active', link.hash === `#${current.id}`));
        const activeLink = tocLinks.find((link) => link.hash === `#${current.id}`);
        if (activeLink) {
          const railRect = noteToc.getBoundingClientRect();
          const linkRect = activeLink.getBoundingClientRect();
          const viewTop = railRect.top + 8;
          const viewBottom = railRect.bottom - 8;
          if (linkRect.top < viewTop) noteToc.scrollTo({ top: noteToc.scrollTop + linkRect.top - viewTop, behavior: reduceMotion ? 'auto' : 'smooth' });
          if (linkRect.bottom > viewBottom) noteToc.scrollTo({ top: noteToc.scrollTop + linkRect.bottom - viewBottom, behavior: reduceMotion ? 'auto' : 'smooth' });
        }
        const chapterIndex = noteChapterList.findIndex((chapter) => chapter.contains(current));
        if (chapterIndex >= 0) noteProgress.textContent = `正文 ${String(chapterIndex + 1).padStart(2, '0')} / ${String(noteChapterList.length).padStart(2, '0')}`;
      }

      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => entry.target.classList.toggle('is-visible', entry.isIntersecting));
        updateTocFromGeometry();
      }, { threshold: .08, rootMargin: '0px 0px -9% 0px' });
      noteContent.querySelectorAll('h1, h2, h3, h4, p, li, blockquote, table, img').forEach((element) => {
        element.classList.add('note-reveal');
        revealObserver.observe(element);
      });

      const tocObserver = new IntersectionObserver(() => updateTocFromGeometry(), { rootMargin: '-18% 0px -65% 0px', threshold: [0, 1] });
      headings.forEach((heading) => tocObserver.observe(heading));
      tocLinks.forEach((link) => link.addEventListener('click', (event) => {
        event.preventDefault();
        document.getElementById(link.hash.slice(1))?.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
        window.setTimeout(updateTocFromGeometry, reduceMotion ? 0 : 520);
      }));

      function decodedHash() {
        try {
          return decodeURIComponent(window.location.hash.slice(1));
        } catch {
          window.history.replaceState(null, '', `${window.location.pathname}${window.location.search}`);
          return '';
        }
      }

      function jumpToHash() {
        clearTimeout(noteHashJumpTimer);
        noteHashJumpTimer = undefined;
        const id = decodedHash();
        if (!id) return;
        if (getSavedNoteReturnPosition()?.hash === window.location.hash) return;
        noteHashJumpTimer = window.setTimeout(() => {
          noteHashJumpTimer = undefined;
          const target = document.getElementById(id);
          if (!target || getSavedNoteReturnPosition()?.hash === window.location.hash) return;
          target.scrollIntoView({ behavior: 'auto', block: 'start' });
          target.classList.add('search-hit');
          window.setTimeout(() => target.classList.remove('search-hit'), 1700);
          window.requestAnimationFrame(updateTocFromGeometry);
        }, reduceMotion ? 0 : 180);
      }
      window.addEventListener('hashchange', () => {
        cancelPendingNoteNavigation({ clearState: true });
        jumpToHash();
      });
      jumpToHash();
      updateTocFromGeometry();
      document.querySelector('.back-top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }));
    })();
  </script>
</body>
</html>
